services:
  - type: web
    name: yolo-detection
    env: docker
    # Standard (2 GB, 2 workers dual-model preloaded). Free (512 MB) was
    # enough for COCO-only with 1 worker; Grounding DINO adds ~200 MB and
    # tensor allocations peak higher, so we need real headroom. If the
    # workload grows, upgrade to a bigger plan via the RENDER DASHBOARD
    # (starter/standard/pro naming has shifted mid-year; per CLAUDE.md
    # memory, `standard_plus` was rejected by blueprint sync elsewhere).
    # Committing `standard` here keeps blueprint validation clean; use
    # dashboard override for anything larger.
    plan: standard
    dockerfilePath: ./Dockerfile
    buildCommand: ""
    startCommand: "python yolo_service.py"
    autoDeploy: true
